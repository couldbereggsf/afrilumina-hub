spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:afrilumina_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:afrilumina_user}
    password: ${DB_PASSWORD:afrilumina_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true

logging:
  level:
    com.reggs.afrilumina: DEBUG
    org.hibernate.SQL: DEBUG

