spring:
  application:
    name: afrilumina-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/afrilumina_db
    username: afrilumina_user
    password: afrilumina_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
      show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-dev-only-secret-change-this-dev-only-secret}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:https://www.afriluminahub.com,http://localhost:5173}
  payments:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      success-url: ${STRIPE_SUCCESS_URL:https://www.afriluminahub.com/payment-success}
      cancel-url: ${STRIPE_CANCEL_URL:https://www.afriluminahub.com/payment-cancelled}
    paypal:
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}   # sandbox by default; swap to live URL when ready

springdoc:
  swagger-ui:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ADMIN_SEED_EMAIL: admin@afriluminahub.com
ADMIN_SEED_PASSWORD: admin123
ADMIN_SEED_NAME: Admin