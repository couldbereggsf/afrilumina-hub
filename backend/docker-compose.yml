version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: afrilumina-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: afrilumina_db
      MYSQL_USER: afrilumina_user
      MYSQL_PASSWORD: afrilumina_pass
    ports:
      - "3306:3306"
    volumes:
      - afrilumina_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: afrilumina-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: afrilumina
      DB_USERNAME: afrilumina_user
      DB_PASSWORD: afrilumina_pass
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_BASE_URL: https://api-m.sandbox.paypal.com
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-Reagan}
      ALLOWED_ORIGINS: https://www.afriluminahub.com,http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  afrilumina_mysql_data:
